<?xml version="1.0" encoding="UTF-8"?>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:t="https://github.com/phoswald/rstm/rstm-template">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Where You Been?</title>
  <link rel="icon" href="../../images/where-you-been.ico"/>
  <link rel="stylesheet" href="../../rstm.css"/>
  <link rel="stylesheet" href="../../locations.css"/>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header>
    <img src="../../images/where-you-been.svg" alt="Logo"/>
    <span>Where You Been?</span>
  </header>
  <main> <!-- style="margin: 0; border: 0; border-radius: 0;" -->
    <div class="rstm-fill">
      <div class="rstm-fill-other">
        <div class="rstm-grid">
          <img src="../../images/user.svg" class="rstm-grid-icon" alt=""/>
          <span t:text="userId" class="rstm-grid-text">???</span>
          <img src="../../images/clock.svg" alt="" class="rstm-grid-icon"/>
          <span t:text="lastTime" class="rstm-grid-text">???</span>
          <a href=""  class="rstm-button-outline rstm-button-icon rstm-grid-action" title="Refresh">
            <img src="../../images/refresh.svg" alt=""/>
          </a>
        </div>
      </div>
      <div class="rstm-fill-remaining" id="map"></div>
    </div>
    <script type="module">
      var mapData = <span t:raw="mapDataJson"/>;
      var map = L.map('map');
      L.tileLayer(mapData.titleLayerUrlTemplate, mapData.titleLayerOptions).addTo(map);
      if(mapData.polyLineCoords) {
        var polyline = L.polyline(mapData.polyLineCoords, mapData.polyLineOptions).addTo(map);
        // map.fitBounds(polyline.getBounds());
        var marker = L.marker(mapData.markerCoords).addTo(map);
        map.setView(mapData.markerCoords, 16);
      } else {
        map.setView({ lat: 0, lng: 0}, 2);
      }
    </script>
  </main>
</body>
</html>
