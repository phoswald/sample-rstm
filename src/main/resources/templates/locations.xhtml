<body>

  <main>
    <h2>Locations of <span t:text="userId">???</span></h2>
    <div id="map" class="rstm-map"></div>
    <script type="module">
      var mapData = await (await fetch("locations.json")).json();
      var map = L.map('map');
      L.tileLayer(mapData.titleLayerUrlTemplate, mapData.titleLayerOptions).addTo(map);
      var polyline = L.polyline(mapData.polyLineCoords, mapData.polyLineOptions).addTo(map);
      // map.fitBounds(polyline.getBounds());
      var marker = L.marker(mapData.markerCoords).addTo(map);
      map.setView(mapData.markerCoords, 16);
    </script>
  </main>
</body>
</html>
